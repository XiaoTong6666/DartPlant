name: CI / Flutter AOT build

on:
  workflow_call:
    inputs:
      family:
        required: true
        type: string
      flutter_version:
        required: true
        type: string
      dart_version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.family }} release/profile AOT
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout DartPlant
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            tests/flutter_fixture/android/**/*.gradle*
            tests/flutter_fixture/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter ${{ inputs.flutter_version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Read NDK version
        id: config
        shell: bash
        run: echo "ndk=$(python3 -c 'import json; print(json.load(open("project-config.json"))["ndkVer"])')" >> "$GITHUB_OUTPUT"

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "cmake;3.22.1" \
            "ndk;${{ steps.config.outputs.ndk }}"

      - name: Cache host ABI analyzer build
        uses: actions/cache@v4
        with:
          path: build/host
          key: dartplant-host-analyzer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**', 'tools/aot-abi-analyzer/**', 'third_party/capstone/**', 'project-config.json') }}
          restore-keys: |
            dartplant-host-analyzer-${{ runner.os }}-${{ runner.arch }}-

      - name: Materialize exact Dart SDK sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../sdk
          git clone \
            --filter=blob:none \
            --no-checkout \
            --depth=1 \
            --branch "${{ inputs.dart_version }}" \
            https://github.com/dart-lang/sdk.git \
            ../sdk
          git -C ../sdk sparse-checkout init --cone
          git -C ../sdk sparse-checkout set runtime/include
          git -C ../sdk checkout --detach "${{ inputs.dart_version }}"
          test -f ../sdk/runtime/include/dart_api_dl.c

      - name: Verify Flutter/Dart family
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version

      - name: Build release/profile ARM64 fixtures
        run: |
          set -euo pipefail
          for mode in release profile; do
            python3 scripts/ci/build_flutter_fixture.py \
              --flutter "$(command -v flutter)" \
              --expected-flutter "${{ inputs.flutter_version }}" \
              --expected-dart "${{ inputs.dart_version }}" \
              --family "${{ inputs.family }}" \
              --mode "$mode" \
              --out "build/ci/flutter/${{ inputs.family }}/$mode"
          done

      - name: Build and verify exact-family libxposed fixture module
        shell: bash
        env:
          DARTPLANT_DART_SDK_ROOT: ${{ github.workspace }}/../sdk
        run: |
          set -euo pipefail
          cd tests/libxposed_fixture_module
          ./gradlew :app:assembleRelease -PdartplantFamily="${{ inputs.dart_version }}"
          cd ../..
          for mode in release profile; do
            out="build/ci/flutter/${{ inputs.family }}/$mode"
            cp tests/libxposed_fixture_module/app/build/outputs/apk/release/app-release.apk \
              "$out/libxposed-module.apk"
            python3 scripts/ci/check_libxposed_module.py \
              --apk "$out/libxposed-module.apk" \
              --family "${{ inputs.dart_version }}" \
              --manifest "$out/manifest.json"
          done

      - name: Build external-module Flutter release fixture
        shell: bash
        run: |
          set -euo pipefail
          # This is a second, test-only AOT program with the built-in DartPlant
          # runtime disabled. It must never replace the ordinary matrix APK.
          external="build/ci/external/${{ inputs.family }}/release"
          DARTPLANT_EXTERNAL_MODULE=1 python3 scripts/ci/build_flutter_fixture.py \
            --flutter "$(command -v flutter)" \
            --expected-flutter "${{ inputs.flutter_version }}" \
            --expected-dart "${{ inputs.dart_version }}" \
            --family "${{ inputs.family }}" \
            --mode release \
            --out "$external"
          regular="build/ci/flutter/${{ inputs.family }}/release"
          cp "$external/app-release.apk" "$regular/external-app-release.apk"
          cp "$external/deferred_probe-release.apk" \
            "$regular/external-deferred_probe-release.apk"
          python3 - "$regular" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          manifest = root / 'manifest.json'
          data = json.loads(manifest.read_text())
          names = ('external-app-release.apk', 'external-deferred_probe-release.apk')
          data['external_module_fixture'] = {
              name: hashlib.sha256((root / name).read_bytes()).hexdigest()
              for name in names
          }
          manifest.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload release/profile AOT fixtures
        uses: actions/upload-artifact@v4
        with:
          name: dartplant-${{ inputs.family }}
          path: build/ci/flutter/${{ inputs.family }}/
          if-no-files-found: error
          retention-days: 7
