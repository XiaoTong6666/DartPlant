name: CI / Android translated Flutter smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  translated-smoke:
    name: API 35 x86_64 / ARM translation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download Flutter family APKs
        uses: actions/download-artifact@v4
        with:
          pattern: dartplant-flutter-*
          path: build/ci/downloads

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run translated ARM smoke in one emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # android-emulator-runner executes this value through /usr/bin/sh.
          # Keep the action boundary POSIX-simple and put strict Bash semantics
          # in a repository script that we can lint and run independently.
          script: bash scripts/ci/run_translated_smoke.sh

      - name: Publish translated smoke summary
        if: always()
        shell: bash
        run: |
          python3 scripts/ci/aggregate_runtime_reports.py \
            --reports build/ci/translated/reports \
            --output build/ci/translated/summary.md \
            --title 'DartPlant API 35 translated ARM smoke'
          cat build/ci/translated/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload translated smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-translated-smoke-evidence
          path: build/ci/translated/**
          if-no-files-found: warn
          retention-days: 14
