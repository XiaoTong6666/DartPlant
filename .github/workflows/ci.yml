name: DartPlant CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      native_arm64_runtime:
        description: Run the experimental native ARM64 Android runtime gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    name: Configure Flutter ABI matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter_matrix: ${{ steps.matrix.outputs.flutter_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load source-verified Flutter families
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 - <<'PY'
          import json
          from pathlib import Path

          families = json.loads(Path('scripts/ci/flutter_families.json').read_text())
          required = {'id', 'flutter', 'dart'}
          if not isinstance(families, list) or len(families) != 3:
              raise SystemExit('expected exactly three Flutter ABI families')
          if any(not isinstance(item, dict) or set(item) != required for item in families):
              raise SystemExit('invalid Flutter family matrix schema')
          if len({item['id'] for item in families}) != len(families):
              raise SystemExit('Flutter family ids must be unique')
          print(json.dumps({'include': families}, separators=(',', ':')))
          PY
          )"
          echo "flutter_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  quality:
    name: Quality and fixture checks
    uses: ./.github/workflows/_quality.yml

  native:
    name: Native builds and tests
    uses: ./.github/workflows/_native.yml

  flutter-aot:
    name: Flutter release/profile AOT / ${{ matrix.id }}
    needs: configure
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.flutter_matrix) }}
    uses: ./.github/workflows/_flutter-aot-build.yml
    with:
      family: ${{ matrix.id }}
      flutter_version: ${{ matrix.flutter }}
      dart_version: ${{ matrix.dart }}

  native-arm64-runtime:
    name: Native ARM64 Flutter runtime (if available)
    if: >-
      ${{ github.event_name == 'push' ||
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.native_arm64_runtime) }}
    needs: flutter-aot
    uses: ./.github/workflows/_arm64-runtime.yml

  translated-smoke:
    name: Android translated ARM smoke (required)
    needs: flutter-aot
    uses: ./.github/workflows/_translated-smoke.yml
