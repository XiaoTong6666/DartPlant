[package]
name = "dartplant-indexer"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
goblin = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
flutterdec-adapter = { path = "../../third_party/flutterdec/crates/flutterdec-adapter" }
flutterdec-loader = { path = "../../third_party/flutterdec/crates/flutterdec-loader" }
